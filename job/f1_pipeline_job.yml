resources:
  jobs:
    F1_Data_Engineering_Pipeline:
      name: F1 Data Engineering Pipeline
      description: End-to-end Formula 1 data engineering pipeline using Bronze,
        Silver, Gold layers and data visualizations.
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: /Repos/baradyukta@gmail.com/f1_data_engineering_pipeline/notebooks/01_bronze
            source: WORKSPACE
        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: /Repos/baradyukta@gmail.com/f1_data_engineering_pipeline/notebooks/02_silver
            source: WORKSPACE
        - task_key: gold_analytics
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: /Repos/baradyukta@gmail.com/f1_data_engineering_pipeline/notebooks/03_gold
            source: WORKSPACE
        - task_key: data_visualizations
          depends_on:
            - task_key: gold_analytics
          notebook_task:
            notebook_path: /Repos/baradyukta@gmail.com/f1_data_engineering_pipeline/notebooks/04_visualization
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
